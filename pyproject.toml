[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career-joleneseng"
version = "0.1.0"
description = "A Python package for visualizing tennis player careers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "matplotlib",
    "requests"
]

[tool.setuptools.packages.find]
include = ["tennis_career*"]